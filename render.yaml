services:
  - type: web
    name: qa-checker
    runtime: python
    plan: standard
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/.browsers playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: SCRAPERAPI_KEY
        sync: false

      - key: GOOGLE_AI_API_KEY
        sync: false

      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.browsers

      - key: DEBUG
        value: "false"
