services:
  - type: web
    name: qa-checker
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: SCRAPERAPI_KEY
        sync: false

      - key: GOOGLE_AI_API_KEY
        sync: false

      - key: DEBUG
        value: "false"