<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Checker — Visual Site Comparison</title>
<style>
:root{--bg:#0a0e1a;--card:#111827;--card-alt:#1a2235;--border:#1f2937;--border-light:#2d3748;--text:#f9fafb;--muted:#9ca3af;--faint:#6b7280;--primary:#6366f1;--primary-h:#818cf8;--green:#10b981;--amber:#f59e0b;--red:#ef4444;--r:12px;--r-sm:7px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.6}
.wrap{max-width:1200px;margin:0 auto;padding:40px 20px}
.site-header{text-align:center;margin-bottom:40px}
.logo-name{font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#fff}
.logo-name span{color:var(--primary-h)}
.tagline{color:var(--muted);font-size:15px;margin-top:8px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:20px;padding:24px}
.url-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
@media(max-width:768px){.url-grid{grid-template-columns:1fr}}
.f-label{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;margin-bottom:8px}
.f-input{width:100%;background:var(--card-alt);border:1px solid var(--border-light);border-radius:var(--r-sm);padding:12px;color:var(--text);font-size:15px;outline:none}
.f-input:focus{border-color:var(--primary)}
.btn{width:100%;background:var(--primary);color:#fff;padding:14px;border-radius:var(--r-sm);font-size:15px;font-weight:600;cursor:pointer;border:none;transition:0.2s}
.btn:hover:not(:disabled){background:var(--primary-h)}
.btn:disabled{opacity:0.6;cursor:not-allowed}
.hidden{display:none!important}
.error-box{padding:16px;background:rgba(239,68,68,.15);border:1px solid var(--red);color:var(--red);border-radius:var(--r-sm);margin-bottom:20px}
.status-text{text-align:center;font-size:16px;color:var(--primary-h);font-weight:600;padding:40px 0}
.split-view{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
@media(max-width:768px){.split-view{grid-template-columns:1fr}}
.view-panel{background:var(--card-alt);border:1px solid var(--border);border-radius:var(--r-sm);padding:16px;display:flex;flex-direction:column}
.view-title{font-size:13px;font-weight:700;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.view-img{width:100%;height:auto;border-radius:4px;border:1px solid var(--border-light);object-fit:contain;background:#000;cursor:pointer;transition:0.2s}
.view-img:hover{opacity:0.8;border-color:var(--primary-h)}
.score-box{text-align:center;padding:30px;background:var(--card-alt);border-radius:var(--r-sm);margin-bottom:24px}
.score-num{font-size:48px;font-weight:800;line-height:1;color:var(--green)}
.score-num.amber{color:var(--amber)}
.score-num.red{color:var(--red)}
.score-lbl{font-size:12px;text-transform:uppercase;color:var(--muted);letter-spacing:1px}
.ai-summary{font-size:16px;margin-top:16px;color:var(--text)}
.list-group{margin-bottom:20px}
.list-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:10px;border-bottom:1px solid var(--border);padding-bottom:6px}
.g-list{list-style:none}
.g-list li{padding:8px 0;font-size:14px;color:var(--muted);display:flex;gap:10px}
.g-list li::before{content:"→";color:var(--primary)}

/* Modal CSS */
.modal{display:none;position:fixed;z-index:9999;left:0;top:0;width:100%;height:100%;overflow:auto;background-color:rgba(0,0,0,0.9);backdrop-filter:blur(5px);}
.modal-content{margin:40px auto;display:block;max-width:90%;max-height:90vh;object-fit:contain;border-radius:8px;}
.close-btn{position:fixed;top:20px;right:40px;color:#fff;font-size:40px;font-weight:bold;cursor:pointer;transition:0.3s;z-index:10000;}
.close-btn:hover{color:var(--primary-h);}
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="logo-name">🔍 QA<span>Checker</span></div>
    <p class="tagline">AI-powered visual regression. Pixel-by-pixel UI comparison.</p>
  </header>

  <div class="card" id="form-card">
    <div class="url-grid">
      <div><label class="f-label">🔵 Baseline URL</label><input type="url" id="inp-base" class="f-input" placeholder="[https://original.com](https://original.com)" required></div>
      <div><label class="f-label">🟣 Challenger URL</label><input type="url" id="inp-chal" class="f-input" placeholder="[https://new-theme.com](https://new-theme.com)" required></div>
    </div>
    <button class="btn" id="run-btn" onclick="runAnalysis()">🚀 Run Visual QA Comparison</button>
  </div>

  <div class="error-box hidden" id="err-box"><span id="err-msg"></span></div>
  
  <div class="card hidden" id="loading-card">
    <div class="status-text" id="status-msg">⏳ Capturing full-page screenshots & running AI analysis... (approx 30s)</div>
  </div>

  <div id="results" class="hidden">
    <div class="score-box">
      <div class="score-lbl">Visual Parity Score</div>
      <div class="score-num" id="score-num">0%</div>
      <p class="ai-summary" id="ai-summary"></p>
    </div>

    <div class="split-view">
      <div class="view-panel">
        <div class="view-title"><span>🔵 Baseline</span> <a id="link-base" href="#" target="_blank" style="color:var(--primary-h);text-decoration:none">View Live</a></div>
        <img id="img-base" class="view-img" src="" alt="Baseline Screenshot" title="Click to enlarge">
      </div>
      <div class="view-panel">
        <div class="view-title"><span>🟣 Challenger</span> <a id="link-chal" href="#" target="_blank" style="color:var(--primary-h);text-decoration:none">View Live</a></div>
        <img id="img-chal" class="view-img" src="" alt="Challenger Screenshot" title="Click to enlarge">
      </div>
    </div>

    <div class="card">
      <div class="list-group">
        <div class="list-title" style="color:var(--amber)">⚠️ Visual Differences</div>
        <ul class="g-list" id="list-diffs"></ul>
      </div>
      <div class="list-group">
        <div class="list-title" style="color:var(--red)">❌ Missing Elements</div>
        <ul class="g-list" id="list-missing"></ul>
      </div>
      <div class="list-group">
        <div class="list-title" style="color:var(--primary-h)">📐 Layout Shifts</div>
        <ul class="g-list" id="list-shifts"></ul>
      </div>
      <button class="btn" onclick="location.reload()" style="margin-top:20px;background:var(--card-alt);color:var(--text);border:1px solid var(--border)">← Start New Comparison</button>
    </div>
  </div>
</div>

<!-- The Image Modal -->
<div id="image-modal" class="modal" onclick="closeModal(event)">
  <span class="close-btn" onclick="closeModal(event)">&times;</span>
  <img class="modal-content" id="modal-img">
</div>

<script>
function safeSet(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }
function safeHtml(id, html) { const el = document.getElementById(id); if (el) el.innerHTML = html; }
function safeHref(id, href) { const el = document.getElementById(id); if (el) el.href = href; }

function renderList(id, arr) {
  if (!arr || arr.length === 0) { safeHtml(id, '<li>No issues detected.</li>'); return; }
  safeHtml(id, arr.map(i => `<li>${i.replace(/</g, '&lt;')}</li>`).join(''));
}

function openModal(src) {
  document.getElementById('image-modal').style.display = "block";
  document.getElementById('modal-img').src = src;
}

function closeModal(e) {
  if (e.target.id === 'image-modal' || e.target.className === 'close-btn') {
    document.getElementById('image-modal').style.display = "none";
  }
}

async function runAnalysis() {
  const bUrl = document.getElementById('inp-base').value.trim();
  const cUrl = document.getElementById('inp-chal').value.trim();
  if(!bUrl || !cUrl) return alert('Both URLs are required.');

  document.getElementById('form-card').classList.add('hidden');
  document.getElementById('err-box').classList.add('hidden');
  document.getElementById('loading-card').classList.remove('hidden');

  try {
    const res = await fetch('/api/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ baselineUrl: bUrl, challengerUrl: cUrl })
    });
    const data = await res.json();
    
    if (!data.success) throw new Error(data.error);

    const r = data.report;
    const a = r.analysis;

    const sc = document.getElementById('score-num');
    sc.textContent = a.matchScore + '%';
    sc.className = 'score-num ' + (a.matchScore >= 90 ? 'green' : a.matchScore >= 70 ? 'amber' : 'red');
    safeSet('ai-summary', a.overallSummary);

    // Bind images to click events for the modal
    const imgBase = document.getElementById('img-base');
    imgBase.src = r.baselineScreenshot;
    imgBase.onclick = () => openModal(r.baselineScreenshot);

    const imgChal = document.getElementById('img-chal');
    imgChal.src = r.challengerScreenshot;
    imgChal.onclick = () => openModal(r.challengerScreenshot);

    safeHref('link-base', r.baselineUrl);
    safeHref('link-chal', r.challengerUrl);

    renderList('list-diffs', a.visualDifferences);
    renderList('list-missing', a.missingElements);
    renderList('list-shifts', a.layoutShifts);

    document.getElementById('loading-card').classList.add('hidden');
    document.getElementById('results').classList.remove('hidden');

  } catch (err) {
    document.getElementById('loading-card').classList.add('hidden');
    document.getElementById('form-card').classList.remove('hidden');
    const errBox = document.getElementById('err-box');
    errBox.classList.remove('hidden');
    safeSet('err-msg', err.message);
  }
}
</script>
</body>
</html>
